<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inside</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body {
    width:100%;
    height:100%;
    overflow:hidden;
    font-family: system-ui,-apple-system,"Microsoft Yahei",sans-serif;
}
/*=====原版双层DOM透镜逻辑=====*/
#bgBlurLayer{
    position:fixed;
    inset:0;
    z-index:997;
    pointer-events:none;
    display:block;
    background:#000000;
    filter: blur(10px);
    mask-image: radial-gradient(circle 70px at var(--mx,0px) var(--my,0px), transparent 0%, #fff 100%);
    -webkit-mask-image: radial-gradient(circle 70px at var(--mx,0px) var(--my,0px), transparent 0%, #fff 100%);
}
#mainWrap{
    position:relative;
    z-index:999;
}
.text-blur{
    filter: blur(10px);
}
.text-clear{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    pointer-events:none;
    display:block;
    mask-image: radial-gradient(circle 70px at var(--mx,0px) var(--my,0px), #fff 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle 70px at var(--mx,0px) var(--my,0px), #fff 0%, transparent 100%);
}
/*====================================================*/

/* 移植 linwan.html 窗口+导航栏样式，黑色红色主题 */
.win-frame{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}
.win-titlebar{
    height:32px;
    background:#2b579a;
    color:#ffffff;
    display:flex;
    align-items:center;
    padding:0 10px;
}
.win-title{
    flex:1;
    font-size:13px;
}
.win-buttons{
    display:flex;
    gap:4px;
}
.win-btn{
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    cursor:default;
    pointer-events:none;
}
.win-btn-min{
    background:#4472b8;
}
.main-container{
    flex:1;
    background:#000000;
    overflow:auto;
}
.top-header{
    background:#000000;
    color:#ff2222;
    padding:14px 40px;
}
.hospital-name{
    font-size:26px;
    font-weight:bold;
}
.hospital-sub{
    font-size:14px;
    opacity:0.85;
    margin-top:4px;
}
.nav-bar{
    background:#0a0a0a;
    border-bottom:1px solid #ff2222;
    display:flex;
    gap:36px;
    padding:12px 40px;
    align-items:center;
    justify-content:flex-start;
}
.nav-left{
    display:flex;
    gap:36px;
}
.nav-item{
    font-size:15px;
    color:#ff2222;
    cursor:default;
    pointer-events:none;
}
.nav-item:hover{
    color:#ff8888;
}

.content-center{
    margin-top:80px;
    text-align:center;
}
.big-main-text{
    font-size:36px;
    font-weight:bold;
    color:#ff2222;
    line-height:1.8;
}
/*正文下方放大版搜索框*/
.search-wrap{
    margin-top:50px;
    display:flex;
    gap:12px;
    justify-content:center;
}
#search-input{
    width:420px;
    padding:16px 20px;
    border:2px solid #ff2222;
    background:#111;
    color:#ff2222;
    font-size:18px;
    outline:none;
}
#search-btn{
    padding:16px 30px;
    background:#ff2222;
    color:#000;
    border:none;
    font-size:18px;
    cursor:pointer;
}
</style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="zhongshi.css">
    <link rel="stylesheet" href="keywords.css">
</head>
<body>
<div id="bgBlurLayer"></div>

<div id="mainWrap">
    <div class="text-blur">
        <div class="win-frame">
            <div class="win-titlebar">
                <div class="win-title">inside</div>
                <div class="win-buttons">
                    <div class="win-btn win-btn-min">−</div>
                </div>
            </div>
            <div class="main-container">
                <div class="top-header">
                    <div class="hospital-name">。。【‘’心理医院</div>
                    <div class="hospital-sub">五感奉于神明，恶念终为真念</div>
                </div>
                <div class="nav-bar">
                    <div class="nav-left">
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                    </div>
                </div>
                <div class="content-center">
                    <div class="big-main-text">无官上神伟力，换取三界安宁</div>
                    <div class="search-wrap">
                        <input id="search-input" placeholder="请输入搜索内容">
                        <button id="search-btn">搜索</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-clear">
        <div class="win-frame">
            <div class="win-titlebar">
                <div class="win-title">inside</div>
                <div class="win-buttons">
                    <div class="win-btn win-btn-min">−</div>
                </div>
            </div>
            <div class="main-container">
                <div class="top-header">
                   <div class="hospital-name">。。【‘’心理医院</div>
                    <div class="hospital-sub">五感奉于神明，恶念终为真念</div>
                </div>
                <div class="nav-bar">
                    <div class="nav-left">
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                        <div class="nav-item">无官上神</div>
                    </div>
                </div>
                <div class="content-center">
                    <div class="big-main-text">无官上神伟力，换取三界安宁</div>
                    <div class="search-wrap">
                        <input data-arg-mirror="1" placeholder="请输入搜索内容">
                        <button data-arg-mirror="1">搜索</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('mousemove',function(e){
    document.documentElement.style.setProperty('--mx',e.clientX+"px");
    document.documentElement.style.setProperty('--my',e.clientY+"px");
});

const searchMap = {
    "白鹿":"lushen.html",
    "血约":"xueyue.html",
    "献祭":"ji.html",
    "沈从良":"shencongliang.html",
    "祭讫":"ji.html",
    "真念":"zhennian.html",
    "妄念":"wangnian.html",
    "恶念":"enian.html",
    "山神":"lushen.html",
    "鹿神":"lushen.html",
    "白鹿山":"lushen.html",
    "无官上神":"wuguanshangshen.html",
    "五感":"wugan1.html"
};

const searchInput = document.querySelector('.text-blur #search-input');
const searchBtn = document.querySelector('.text-blur #search-btn');

function doSearch(){
    let val = searchInput.value.trim();
    if(searchMap[val]){
        window.location.href = searchMap[val];
    }else{ 
        alert("未匹配关键词");
    }
}
searchBtn.onclick = doSearch;
searchInput.onkeydown = function(e){
    if(e.key === "Enter") doSearch();
};
</script>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
    <script src="zhongshi.js" defer></script>
    <script src="keywords.js" defer></script>
</body>
</html>
