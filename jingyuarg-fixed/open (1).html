<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>open</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 本地背景图，把图片放到同目录，修改文件名 */
            background: url("lock_bg.jpg") center / cover no-repeat fixed;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
            /* 深色遮罩，文字看得更清楚 */
            background-color: rgba(0,0,0,0.3);
            background-blend-mode: multiply;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 用户头像 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            /* 本地头像图片 */
            background-image: url("avatar.png");
            background-size: cover;
            background-position: center;
            margin-bottom: 16px;
            border: 2px solid rgba(255,255,255,0.4);
        }

        .username {
            font-size: 22px;
            margin-bottom: 24px;
        }

        .input-wrap {
            display: flex;
            gap: 8px;
        }

        #pwdInput {
            width: 220px;
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.85);
        }

        #unlockBtn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #0078d4;
            color: white;
            font-size:15px;
        }

        #tip {
            margin-top:12px;
            font-size:14px;
            min-height:18px;
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="keywords.css">
</head>
<body>
    <div class="avatar"></div>
    <div class="username">用户</div>
    <div class="input-wrap">
        <input type="password" id="pwdInput" placeholder="请输入密码">
        <button id="unlockBtn">解锁</button>
    </div>
    <div id="tip"></div>

    <script>
        // 本次会话已经解锁过，直接进桌面
        try{
            if(sessionStorage.getItem("argUnlocked") === "1"){
                location.replace("index.html");
            }
        }catch(e){}

        //====================安全防护脚本====================
        document.oncontextmenu = function(){return false;};
        document.onkeydown = function(e){
            e = e || window.event;
            if(e.keyCode===123) return false;
            if(e.ctrlKey && e.keyCode===85) return false;
            if(e.ctrlKey && e.shiftKey && (e.keyCode===73||e.keyCode===74)) return false;
        };
        history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', function () {
            history.pushState(null, null, window.location.href);
        });
        //====================================================

        const correctPwd = "20090404";
        const input = document.querySelector('#pwdInput');
        const btn = document.querySelector('#unlockBtn');
        const tip = document.querySelector('#tip');

        function checkPwd(){
            const val = input.value.trim();
            if(val === correctPwd){
                tip.innerText = "✅ 解锁成功";
                // 标记已解锁，桌面不再重复要求输入密码
                try { sessionStorage.setItem("argUnlocked","1"); } catch(e){}
                //密码正确跳转到 index.html
                location.href="index.html";
            }else{
                tip.innerText = "❌ 密码错误";
                input.value = "";
            }
        }

        btn.addEventListener('click', checkPwd);
        // 回车也可以提交
        input.addEventListener('keydown', e=>{
            if(e.key === 'Enter') checkPwd();
        })
    </script>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
    <script src="keywords.js" defer></script>
</body>
</html>
