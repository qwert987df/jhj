<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回收站</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            user-select:none;
        }
        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
            font-family:system-ui,-apple-system,sans-serif;
        }
        .win-frame{
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
        }
        .win-titlebar{
            height:32px;
            background:#2b579a;
            color:#fff;
            display:flex;
            align-items:center;
            padding:0 10px;
        }
        .win-title{
            flex:1;
            font-size:13px;
        }
        .win-buttons{
            display:flex;
            gap:4px;
        }
        .win-btn{
            width:26px;
            height:26px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:14px;
        }
        .win-btn-min{
            background:#4472b8;
        }
        .recycle-container{
            flex:1;
            background:#ffffff;
            padding:20px;
            overflow:auto;
        }
        .file-item{
            width:80px;
            text-align:center;
            cursor:pointer;
        }
        .file-icon{
            width:48px;
            height:48px;
            margin:0 auto 6px;
            font-size:40px;
        }
        .file-name{
            font-size:12px;
        }
        .unzip-badge{
            display:block;
            margin:4px auto 0;
            width:fit-content;
            padding:1px 8px;
            border-radius:999px;
            font-size:11px;
            color:#0b7a4b;
            background:rgba(16,185,129,.14);
            border:1px solid rgba(16,185,129,.45);
        }
        .file-item.selected{
            background:rgba(0,120,215,0.2);
        }

        /*模态弹窗*/
        .modal-wrap{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.4);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:999;
            display:none;
        }
        .modal-wrap.show{
            display:flex;
        }
        .modal-box{
            width:340px;
            background:#fff;
            border:1px solid #999;
            box-shadow:0 4px 12px #0003;
        }
        .modal-head{
            height:30px;
            background:#2b579a;
            color:white;
            display:flex;
            align-items:center;
            padding:0 10px;
            font-size:13px;
        }
        .modal-body{
            padding:16px;
        }
        .modal-body p{
            font-size:14px;
            margin-bottom:10px;
        }
        .modal-body input{
            width:100%;
            padding:6px 8px;
            font-size:14px;
            border:1px solid #aaa;
            margin-bottom:12px;
        }
        .modal-buttons{
            display:flex;
            justify-content:flex-end;
            gap:8px;
        }
        .modal-buttons button{
            padding:4px 14px;
            cursor:pointer;
        }

        /*解压进度条*/
        .progress-wrap{
            display:none;
        }
        .progress-wrap.show{
            display:block;
        }
        .progress-desc{
            font-size:13px;
            margin-bottom:6px;
        }
        .progress-bar-bg{
            width:100%;
            height:18px;
            background:#ddd;
            border:1px solid #999;
            overflow:hidden;
            border-radius: 3px;
        }
        .progress-bar-fill{
            height:100%;
            width:0%;
            background:linear-gradient(90deg,#0078d7,#38bdf8);
            transition:width 4s linear;
            position:relative;
        }
        .progress-bar-fill::after{
            content:"";
            position:absolute;
            inset:0;
            background:repeating-linear-gradient(115deg, rgba(255,255,255,.35) 0 8px, rgba(255,255,255,0) 8px 18px);
            animation:flow 0.9s linear infinite;
        }
        @keyframes flow{
            from{ transform:translateX(0); }
            to{ transform:translateX(18px); }
        }
        .progress-pct{
            float:right;
            font-size:12px;
            color:#555;
        }
        /*解压完成面板*/
        .done-wrap{
            display:none;
            margin:6px 0 14px;
            padding:14px 16px;
            border-radius:8px;
            background:#eef6ff;
            border:1px solid #b6dcff;
            color:#14508a;
            font-size:13.5px;
            line-height:1.8;
        }
        .done-wrap.show{ display:block; }
        .done-wrap b{ color:#0b62c4; }
        .modal-toast{
            position:fixed;
            left:50%;
            bottom:28px;
            transform:translate(-50%,16px);
            background:#2b579a;
            color:#fff;
            padding:10px 18px;
            border-radius:8px;
            font-size:13px;
            box-shadow:0 10px 26px rgba(0,0,0,.35);
            opacity:0;
            pointer-events:none;
            transition:opacity .3s ease, transform .3s cubic-bezier(.22,1,.36,1);
            z-index:1000;
        }
        .modal-toast.show{
            opacity:1;
            transform:translate(-50%,0);
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="keywords.css">
</head>
<body>
<div class="win-frame">
    <div class="win-titlebar">
        <div class="win-title">回收站</div>
        <div class="win-buttons">
            <div class="win-btn win-btn-min" onclick="location.href='index.html'">−</div>
        </div>
    </div>
    <div class="recycle-container">
        <div class="file-item" id="zipFile">
            <div class="file-icon">📦</div>
            <div class="file-name">jingyu.7z</div>
        </div>
    </div>
</div>

<!--密码弹窗-->
<div class="modal-wrap" id="pwdModal">
    <div class="modal-box">
        <div class="modal-head">输入压缩包密码</div>
        <div class="modal-body">
            <p>请输入 jingyu.7z 的解压密码：</p >
            <input type="password" id="pwdInput" placeholder="输入密码">
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-desc">正在解压 jingyu.7z ... <span class="progress-pct" id="progressPct">0%</span></div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="done-wrap" id="doneWrap">
                <span id="doneMark">✅ <b>解压完成</b></span><br>
                <span id="doneText">jingyu.7z 已释放到桌面，回到桌面可以看到<b>【静愈心理医院】</b>应用图标。</span>
            </div>
            <div class="modal-buttons">
                <button id="btnConfirm">确定</button>
                <button id="btnCancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-toast" id="modalToast"></div>

<script>
//====================安全防护脚本====================
//禁止鼠标右键
document.oncontextmenu = function(){return false;};
//屏蔽快捷键 F12、Ctrl+U、Ctrl+Shift+I、Ctrl+Shift+J
document.onkeydown = function(e){
    e = e || window.event;
    if(e.keyCode===123) return false; //F12
    if(e.ctrlKey && e.keyCode===85) return false; //Ctrl+U
    if(e.ctrlKey && e.shiftKey && (e.keyCode===73||e.keyCode===74)) return false;
};
//禁止浏览器回退，无法返回上一页
history.pushState(null, null, window.location.href);
window.addEventListener('popstate', function () {
    history.pushState(null, null, window.location.href);
});
//====================================================

const zipFile = document.getElementById('zipFile');
const pwdModal = document.getElementById('pwdModal');
const pwdInput = document.getElementById('pwdInput');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressPct = document.getElementById('progressPct');
const doneWrap = document.getElementById('doneWrap');
const doneMark = document.getElementById('doneMark');
const doneText = document.getElementById('doneText');
const modalToast = document.getElementById('modalToast');
const btnConfirm = document.getElementById('btnConfirm');
const btnCancel = document.getElementById('btnCancel');

/* idle        等待输入密码
   extracting  正在解压
   done        已经解压完（或之前就解压过） */
let state = 'idle';

function isUnzipped(){
    try { return localStorage.getItem('unzipJingyu') === 'true'; } catch(e){ return false; }
}

/* 回到桌面：
   在桌面窗口里必须请桌面「收起这个窗口」，
   不能直接 location.href='index.html' —— 那会把整个桌面套进这个窗口的 iframe 里，
   看起来就是画面错乱 / 卡住。 */
function goDesktop(){
    const inFrame = (function(){
        try { return window.self !== window.top; } catch(e){ return true; }
    })();
    if(!inFrame){
        location.href = 'index.html';
        return;
    }

    // 在窗口里：请桌面收起这个窗口。
    // 桌面会回一条 arg-minimize-ok；如果 0.7 秒都没收到回执，
    // 说明外层不是我们的桌面（比如被人嵌到别的页面里），这时才直接跳转兜底。
    let acked = false;
    function onAck(ev){
        if(ev && ev.data && ev.data.type === 'arg-minimize-ok') acked = true;
    }
    window.addEventListener('message', onAck);
    try { window.parent.postMessage({ type: 'arg-minimize' }, '*'); } catch(e){}
    setTimeout(function(){
        window.removeEventListener('message', onAck);
        if(!acked) location.href = 'index.html';
    }, 700);
}

/* 根据状态渲染两个按钮的文案与可用性 */
function renderButtons(){
    if(state === 'done'){
        btnConfirm.textContent = '回到桌面';
        btnConfirm.disabled = false;
        btnConfirm.style.opacity = '';
        btnCancel.textContent = '关闭';
    }else if(state === 'extracting'){
        btnConfirm.textContent = '解压中…';
        btnConfirm.disabled = true;
        btnConfirm.style.opacity = '0.6';
        btnCancel.textContent = '取消';
    }else{
        btnConfirm.textContent = '确定';
        btnConfirm.disabled = false;
        btnConfirm.style.opacity = '';
        btnCancel.textContent = '取消';
    }
}

function showToast(text){
    modalToast.textContent = text;
    modalToast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>modalToast.classList.remove('show'), 2200);
}

function resetProgress(){
    // 关闭过渡再归零，避免进度条出现倒放动画
    progressFill.style.transition = 'none';
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    void progressFill.offsetWidth;
    progressFill.style.transition = '';
}

function openModal(){
    if(state === 'extracting') return;
    pwdModal.classList.add('show');
    pwdInput.value = '';
    progressWrap.classList.remove('show');
    resetProgress();

    if(isUnzipped()){
        // 之前已经解压过，不必再问一次密码
        state = 'done';
        doneMark.innerHTML = '✅ <b>已经解压过了</b>';
        doneText.innerHTML = 'jingyu.7z 之前就已经释放到桌面，<b>【静愈心理医院】</b>应用图标应该已经在桌面上。';
        doneWrap.classList.add('show');
        renderButtons();
        return;
    }

    state = 'idle';
    doneWrap.classList.remove('show');
    renderButtons();
    setTimeout(()=>pwdInput.focus(), 60);
}

//双击7z弹出密码框（同时兼容触屏双击）
zipFile.ondblclick = openModal;
let lastTap = 0;
zipFile.addEventListener('pointerup', (e)=>{
    if(e.pointerType === 'mouse') return;
    const now = Date.now();
    if(now - lastTap < 400) openModal();
    lastTap = now;
});
zipFile.addEventListener('click', ()=>{
    zipFile.classList.add('selected');
    setTimeout(()=>zipFile.classList.remove('selected'), 220);
});

//取消关闭弹窗
btnCancel.onclick = ()=>{
    if(state === 'extracting') return;
    pwdModal.classList.remove('show');
};

btnConfirm.onclick = ()=>{
    if(state === 'extracting') return;

    // 已经解压完了：这个按钮现在就是「回到桌面」
    if(state === 'done'){ goDesktop(); return; }

    const inputPwd = pwdInput.value.trim();
    const rightPwd = "9634711";
    if(inputPwd !== rightPwd){
        showToast('密码错误，请重新输入！');
        pwdInput.value = '';
        pwdInput.focus();
        try{
            pwdInput.animate(
                [{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],
                {duration:260, easing:'ease-in-out'}
            );
        }catch(e){}
        return;
    }

    //密码正确：播放 4 秒解压进度
    state = 'extracting';
    renderButtons();
    progressWrap.classList.add('show');
    progressPct.textContent = '0%';
    progressFill.style.transition = 'none';
    progressFill.style.width = '0%';
    void progressFill.offsetWidth;
    progressFill.style.transition = 'width 4s linear';

    // 用 rAF 保证浏览器先生成 0% 的布局，进度条才会真正走动画
    requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
            progressFill.style.width = '100%';
        });
    });

    const t0 = Date.now();
    const DURATION = 4000;
    const timer = setInterval(()=>{
        const p = Math.min(100, Math.round((Date.now() - t0) / DURATION * 100));
        progressPct.textContent = p + '%';
        if(p >= 100) clearInterval(timer);
    }, 80);

    setTimeout(()=>{
        clearInterval(timer);
        progressPct.textContent = '100%';
        //本地存储标记：解压完成，桌面显示静愈心理医院图标
        try { localStorage.setItem("unzipJingyu","true"); } catch(e){}
        state = 'done';
        doneMark.innerHTML = '✅ <b>解压完成</b>';
        doneText.innerHTML = 'jingyu.7z 已释放到桌面，回到桌面可以看到<b>【静愈心理医院】</b>应用图标。';
        doneWrap.classList.add('show');
        renderButtons();
        addUnzipBadge();
        showToast('解压完成！点「回到桌面」即可看到【静愈心理医院】');
    }, DURATION);
};

//回车提交
pwdInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && state !== 'extracting') btnConfirm.click();
});

// 给文件加一个「已解压」标记
function addUnzipBadge(){
    const name = zipFile.querySelector('.file-name');
    if(!name || name.querySelector('.unzip-badge')) return;
    const b = document.createElement('span');
    b.className = 'unzip-badge';
    b.textContent = '已解压';
    name.appendChild(b);
}

// 打开页面时如果已经解压过，直接标上
if(isUnzipped()) addUnzipBadge();

/* 旧逻辑保留说明：
   原来这里是 zipFile.ondblclick 直接弹出密码框、密码正确后 alert 提示，
   进度条因为先 display:block 再立刻改宽度，4 秒动画几乎不会播放。
   现在改为 rAF 启动动画 + 百分比计数 + 页内完成提示，不再打断式弹窗。 */
/*
zipFile.ondblclick = ()=>{
    pwdModal.classList.add('show');
    pwdInput.value = '';
    progressWrap.classList.remove('show');
    progressFill.style.width = '0%';
};
*/
</script>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
    <script src="keywords.js" defer></script>
</body>
</html>
