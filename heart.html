<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #b71c1c;
            position: relative;
        }
        /*右下角返回主页小按钮*/
        .back-home {
            position: absolute;
            right: 16px;
            bottom: 16px;
            font-size:13px;
            color:#ffffff;
            cursor: pointer;
            z-index:10;
            opacity:0.75;
        }
        .back-home:hover{
            opacity:1;
        }
        /*器官心脏容器，跳动动画*/
        .heart-wrap {
            position: absolute;
            left:50%;
            top:50%;
            transform: translate(-50%, -50%);
            animation: beat 0.75s infinite;
        }
        .heart-wrap img {
            width: 240px;
            height: auto;
            display:block;
        }
        /*器官心跳缩放动画*/
        @keyframes beat {
            0%{transform: translate(-50%, -50%) scale(1);}
            18%{transform: translate(-50%, -50%) scale(1.13);}
            32%{transform: translate(-50%, -50%) scale(1);}
            50%{transform: translate(-50%, -50%) scale(1.10);}
            66%{transform: translate(-50%, -50%) scale(1);}
            100%{transform: translate(-50%, -50%) scale(1);}
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="keywords.css">
</head>
<body>
    <div class="heart-wrap">
        <img src="heart_organ.png" alt="人体心脏器官">
    </div>
    <div class="back-home" onclick="location.href='jingyu.html'">返回主页</div>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
    <script src="keywords.js" defer></script>
</body>
</html>
