<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静愈心理医院</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html,body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui,-apple-system,"Microsoft Yahei",sans-serif;
        }
        /*窗口外壳，和回收站/微信页面样式统一*/
        .win-frame{
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
        }
        .win-titlebar{
            height:32px;
            background:#2b579a;
            color:#ffffff;
            display:flex;
            align-items:center;
            padding:0 10px;
        }
        .win-title{
            flex:1;
            font-size:13px;
        }
        .win-buttons{
            display:flex;
            gap:4px;
        }
        .win-btn{
            width:26px;
            height:26px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:14px;
        }
        .win-btn-min{
            background:#4472b8;
        }
        /*主内容区域*/
        .main-container{
            flex:1;
            background: url("hospital_bg.jpg") center / cover no-repeat;
            overflow:auto;
        }
        /*【保留原来蓝色头部】*/
        .top-header{
            background:#165DFF;
            color:#fff;
            padding:14px 40px;
        }
        .hospital-name{
            font-size:26px;
            font-weight:bold;
        }
        .hospital-sub{
            font-size:14px;
            opacity:0.85;
            margin-top:4px;
        }
        .nav-bar{
            background:#ffffff;
            border-bottom:1px solid #e5e7eb;
            display:flex;
            gap:36px;
            padding:12px 40px;
            align-items:center;
            justify-content:space-between;
        }
        .nav-left{
            display:flex;
            gap:36px;
        }
        .nav-item{
            font-size:15px;
            color:#333;
            cursor:pointer;
        }
        .nav-item:hover{
            color:#165DFF;
        }
        /*搜索栏样式*/
        .search-wrap{
            display:flex;
            gap:6px;
        }
        #search-input{
            width:220px;
            padding:6px 10px;
            border:1px solid #cccccc;
            border-radius:4px;
            font-size:14px;
            outline:none;
        }
        #search-btn{
            padding:6px 14px;
            background:#165DFF;
            color:#fff;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-size:14px;
        }

        /*导航栏下方居中大字区域*/
        .hero-area{
            text-align:center;
            padding:80px 20px;
            color:#ffffff;
        }
        .hero-big{
            font-size:44px;
            font-weight:bold;
            margin-bottom:14px;
        }
        .hero-sub{
            font-size:24px;
            opacity:0.9;
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="keywords.css">
</head>
<body>
<div class="win-frame">
    <div class="win-titlebar">
        <div class="win-title">静愈心理医院</div>
        <div class="win-buttons">
            <div class="win-btn win-btn-min" onclick="location.href='index.html'">−</div>
        </div>
    </div>
    <div class="main-container">
        <!--原样保留蓝色顶部header-->
        <div class="top-header">
            <div class="hospital-name">静愈心理医院</div>
            <div class="hospital-sub">精神心理专科 · 正规医疗机构</div>
        </div>
        <!--全部导航按钮加上跳转，链接留空待填写-->
        <div class="nav-bar">
            <div class="nav-left">
                <div class="nav-item" onclick="location.href='jingyu.html'">医院首页</div>
                <div class="nav-item" onclick="location.href='jianjie.html'">医院简介</div>
                <div class="nav-item" onclick="location.href='keshi.html'">科室介绍</div>
                <div class="nav-item" onclick="location.href='zhuanjia.html'">专家团队</div>
                <div class="nav-item" onclick="location.href='jiuzhen.html'">就诊指南</div>
                <div class="nav-item" onclick="location.href='contact.html'">联系我们</div>
            </div>
            <div class="search-wrap">
                <input id="search-input" placeholder="请输入搜索内容">
                <button id="search-btn">搜索</button>
            </div>
        </div>

        <!--导航栏下面：居中白色大字-->
        <div class="hero-area">
            <div class="hero-big">静愈心理医院</div>
            <div class="hero-sub">为您的心理健康护航</div>
        </div>

    </div>
</div>

<script>
//====================开发者工具检测，检测到直接展示暂无信息====================
let devToolOpened = false;
const clearPage = () => {
    if(devToolOpened) return;
    devToolOpened = true;
    document.body.innerHTML = `<div style="width:100%;height:100vh;display:flex;align-items:center;justify-content:center;font-size:22px;color:#666;">暂无信息</div>`;
};

function checkDevSize(){
    // 处于窗口化桌面 / iframe 中时跳过尺寸检测，避免把正常窄窗口误判成开发者工具
    if (window.top !== window.self) return;
    const threshold = 150;
    if (Math.abs(window.outerWidth - window.innerWidth) > threshold || Math.abs(window.outerHeight - window.innerHeight) > threshold) {
        clearPage();
    }
}
setInterval(checkDevSize, 400);

(function() {
    function debugTrap() {
        try {
            debugger;
        } catch(e) {}
    }
    setInterval(debugTrap, 800);
})();

document.oncontextmenu = function(){return false;};
document.onkeydown = function(e){
    e = e || window.event;
    if(e.keyCode===123) return false;
    if(e.ctrlKey && e.keyCode===85) return false;
    if(e.ctrlKey && e.shiftKey && (e.keyCode===73||e.keyCode===74)) return false;
};
history.pushState(null, null, window.location.href);
window.addEventListener('popstate',function(){
    history.pushState(null,null,window.location.href);
});
//====================================================

//搜索功能：三个关键词分别跳转不同页面
const searchInput = document.querySelector('#search-input');
const searchBtn = document.querySelector('#search-btn');

function doSearch(){
    const keyword = searchInput.value.trim();
    if(!keyword){
        alert("请输入搜索关键词");
        return;
    }
    if(keyword === "静心科"){
        location.href = "jxin.html";
    }else if(keyword === "静心疗愈，守护心灵"){
        location.href = "idea.html";
    }else if(keyword === "18305564297806"){
        location.href = "tel.html";
    }else if(keyword === "god"){
        location.href = "god.html";
    }else if(keyword === "念头"){
        location.href = "niantou.html";
    }else if(keyword === "抑郁障碍"){
        location.href = "yiyu.html";
    }else if(keyword === "抑郁"){
        location.href = "yiyu.html";
    }else if(keyword === "心理修复"){
        location.href = "heart.html";
    }else if(keyword === "视觉干扰"){
        location.href = "jxin.html";
    }else if(keyword === "五感"){
        location.href = "wugan.html";
    }else if(keyword === "思维循环"){
        location.href = "zhiliao.html";
    }else if(keyword === "思维"){
        location.href = "zhiliao.html";
    }else if(keyword === "沈从良"){
        location.href = "shen.html";
    }else if(keyword === "王羽"){
        location.href = "wangyu.html";
    }else if(keyword === "林晚"){
        location.href = "linwan.html";
    }else if(keyword === "深度治疗"){
        location.href = "zhiliao.html";
    }else if(keyword === "静心"){
        location.href = "heart.html";
    }else if(keyword === "heart"){
        location.href = "heart.html";
    }else if(keyword === "research"){
        location.href = "research.html";
    }else{
        alert("搜索关键词：" + keyword);
    }
}
searchBtn.addEventListener('click',doSearch);
searchInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter') doSearch();
});
</script>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
    <script src="keywords.js" defer></script>
</body>
</html>
