<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /*左下角返回首页*/
        .back-home {
            position: fixed;
            left: 16px;
            bottom: 16px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            z-index: 10;
        }
        .back-home:hover {
            color: #fff;
        }
        .page-title {
            font-size: 48px;
            margin-bottom: 40px;
            font-weight: bold;
        }
        .box-wrap {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        #pwdInput {
            width: 280px;
            height: 44px;
            padding: 0 12px;
            font-size: 18px;
        }
        #decryptBtn {
            width: 140px;
            height: 44px;
            font-size:17px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="keywords.css">
</head>
<body>
    <h1 class="page-title">加密文件</h1>
    <div class="box-wrap">
        <input type="text" id="pwdInput" placeholder="密码">
        <button id="decryptBtn">解密</button>
    </div>

    <div class="back-home" onclick="location.href='jingyu.html'">返回首页</div>

    <script>
        const input = document.getElementById("pwdInput");
        const btn = document.getElementById("decryptBtn");
        btn.addEventListener("click", function(){
            if(input.value.trim() === "black"){
                location.href = "black.html";
            }else{
                alert("密码错误");
            }
        });
        //回车也可以解密
        input.addEventListener("keydown",e=>{
            if(e.key === "Enter") btn.click();
        })
    </script>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
    <script src="keywords.js" defer></script>
</body>
</html>
