<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xueyue</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body {
    width:100%;
    height:100%;
    overflow:hidden;
    font-family: system-ui,-apple-system,"Microsoft Yahei",sans-serif;
}

/*透镜系统 沿用参数 blur8px 圆孔75px*/
#bgBlurLayer{
    position:fixed;
    inset:0;
    z-index:997;
    pointer-events:none;
    background:#000000;
    filter: blur(8px);
    mask-image: radial-gradient(circle 75px at var(--mx,0px) var(--my,0px), transparent 0%, #fff 100%);
    -webkit-mask-image: radial-gradient(circle 75px at var(--mx,0px) var(--my,0px), transparent 0%, #fff 100%);
}

#mainWrap{
    position:relative;
    z-index:999;
    width:100%;
    height:100%;
}

.text-blur{
    filter: blur(8px);
    width:100%;
    height:100%;
    background:#000000;
    overflow:auto;
    padding:40px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.text-clear{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:auto;
    padding:40px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    mask-image: radial-gradient(circle 75px at var(--mx,0px) var(--my,0px), #fff 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle 75px at var(--mx,0px) var(--my,0px), #fff 0%, transparent 100%);
}

/* === win‑frame窗口UI导航：窗口撑满屏幕宽度 === */
.win-frame{
    width:100%;
    display:flex;
    flex-direction:column;
    max-width:100%;
}
.win-titlebar{
    height:32px;
    background:#2b579a;
    color:#ffffff;
    display:flex;
    align-items:center;
    padding:0 10px;
}
.win-title{
    flex:1;
    font-size:13px;
}
.win-buttons{
    display:flex;
    gap:4px;
}
.win-btn{
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    cursor:default;
    pointer-events:none;
}
.win-btn-min{
    background:#4472b8;
}
.main-container{
    background:rgba(0,0,0,0.75);
    padding:14px 40px;
}
.top-header{
    margin-bottom:12px;
}
.hospital-name{
    font-size:26px;
    font-weight:bold;
    color:#ff2222;
}
.hospital-sub{
    font-size:14px;
    opacity:0.85;
    color:#ff2222;
    margin-top:4px;
}
/*导航栏横向铺满画面，元素均匀散开占满整行*/
.nav-bar{
    background:rgba(10,10,10,0.75);
    border-bottom:1px solid #ff2222;
    display:flex;
    justify-content: space-around;
    padding:12px 40px;
    width:100%;
}
.nav-item{
    font-size:15px;
    color:#ff2222;
    cursor:default;
    pointer-events:none;
}
.nav-item:hover{
    color:#ff8888;
}

/*页面业务内容样式*/
.page-title{
    font-size:42px;
    margin:30px 0 36px;
    color:#ff2222;
    text-align:center;
}
table{
    border-collapse: collapse;
    margin:0 auto 36px;
    max-width:800px;
    width:90%;
}
th,td{
    border:1px solid #700000;
    padding:12px 28px;
    font-size:20px;
    text-align:center;
    color:#ff2222;
}
th{
    color:#ff4444;
}
.desc-text{
    font-size:22px;
    margin-bottom:12px;
    color:#ff2222;
    text-align:center;
}

/*黑色方块遮罩，修复点击失效：去掉上层pointer-events:none干扰*/
.mask-wrap{
    position:relative;
    display:inline-block;
}
.mask-text{
    visibility:hidden;
}
.mask-block{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000000;
    border:1px solid #bb0000;
    cursor:pointer;
    transition: 0.25s;
    z-index:10;
}
.mask-wrap.revealed .mask-text{
    visibility:visible;
}
.mask-wrap.revealed .mask-block{
    opacity:0;
    z-index:-1;
}
</style>
    <link rel="stylesheet" href="arg-ui.css">

<script>
//鼠标透镜跟随
document.addEventListener('mousemove',function(e){
    document.documentElement.style.setProperty('--mx',e.clientX+"px");
    document.documentElement.style.setProperty('--my',e.clientY+"px");
});

//修复：获取全部两套遮罩，点击方块同步解锁
const allMasks = document.querySelectorAll('[data-mask="target"] .mask-block');
allMasks.forEach(block=>{
    block.addEventListener("click",(ev)=>{
        ev.stopPropagation();
        document.querySelectorAll('[data-mask="target"]').forEach(wrap=>{
            wrap.classList.add("revealed");
        })
    })
})
</script>
