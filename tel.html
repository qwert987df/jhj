<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院内部紧急电话 - 静愈心理医院</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui,-apple-system,"Microsoft Yahei",sans-serif;
        }
        /*窗口外壳*/
        .win-frame{
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
        }
        .win-titlebar{
            height:32px;
            background:#2b579a;
            color:#ffffff;
            display:flex;
            align-items:center;
            padding:0 10px;
        }
        .win-title{
            flex:1;
            font-size:13px;
        }
        .win-buttons{
            display:flex;
            gap:4px;
        }
        .win-btn{
            width:26px;
            height:26px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:14px;
        }
        .win-btn-min{
            background:#4472b8;
        }
        /*主内容区域*/
        .main-container{
            flex:1;
            background:#f7f8fa;
            overflow:auto;
        }
        .top-header{
            background:#165DFF;
            color:#fff;
            padding:14px 40px;
        }
        .hospital-name{
            font-size:26px;
            font-weight:bold;
        }
        .hospital-sub{
            font-size:14px;
            opacity:0.85;
            margin-top:4px;
        }
        .nav-bar{
            background:#ffffff;
            border-bottom:1px solid #e5e7eb;
            display:flex;
            gap:36px;
            padding:12px 40px;
            align-items:center;
            justify-content:space-between;
        }
        .nav-left{
            display:flex;
            gap:36px;
        }
        .nav-item{
            font-size:15px;
            color:#333;
            cursor:pointer;
        }
        .nav-item:hover{
            color:#165DFF;
        }
        .search-wrap{
            display:flex;
            gap:6px;
        }
        #search-input{
            width:220px;
            padding:6px 10px;
            border:1px solid #cccccc;
            border-radius:4px;
            font-size:14px;
            outline:none;
        }
        #search-btn{
            padding:6px 14px;
            background:#165DFF;
            color:#fff;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-size:14px;
        }
        /*正文居中模块*/
        .content-wrap{
            max-width:600px;
            margin:80px auto;
            padding:0 24px;
            text-align:center;
        }
        .page-title{
            font-size:32px;
            color:#111;
            margin-bottom:40px;
        }
        #telInput{
            width:100%;
            padding:14px 16px;
            font-size:18px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
        }
        #callBtn{
            margin-top:22px;
            width:100%;
            padding:14px;
            background:#165DFF;
            color:#fff;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
        }
        #callBtn:hover{
            background:#0e4bdd;
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="keywords.css">
</head>
<body>
<div class="win-frame">
    <div class="win-titlebar">
        <div class="win-title">医院内部紧急电话 - 静愈心理医院</div>
        <div class="win-buttons">
            <div class="win-btn win-btn-min" onclick="location.href='index.html'">−</div>
        </div>
    </div>
    <div class="main-container">
        <div class="top-header">
            <div class="hospital-name">静愈心理医院</div>
            <div class="hospital-sub">精神心理专科 · 正规医疗机构</div>
        </div>
        <div class="nav-bar">
            <div class="nav-left">
                <div class="nav-item" onclick="location.href='jingyu.html'">医院首页</div>
                <div class="nav-item" onclick="location.href='jianjie.html'">医院简介</div>
                <div class="nav-item" onclick="location.href='keshi.html'">科室介绍</div>
                <div class="nav-item" onclick="location.href='zhuanjia.html'">专家团队</div>
                <div class="nav-item" onclick="location.href='jiuzhen.html'">就诊指南</div>
                <div class="nav-item" onclick="location.href='contact.html'">联系我们</div>
            </div>
            <div class="search-wrap">
                <input id="search-input" placeholder="请输入搜索内容">
                <button id="search-btn">搜索</button>
            </div>
        </div>

        <div class="content-wrap">
            <h2 class="page-title">医院内部紧急电话</h2>
            <input id="telInput" placeholder="请输入内部电话号码">
            <button id="callBtn">拨打</button>
        </div>
    </div>
</div>

<!--本地音频资源-->
<audio id="audio1" preload="auto">
    <source src="audio1.mp3">
</audio>

<audio id="audio2" preload="auto">
    <source src="audio2.mp3">
</audio>


<script>
let devToolOpened = false;
const clearPage = () => {
    if(devToolOpened) return;
    devToolOpened = true;
    document.body.innerHTML = `<div style="width:100%;height:100vh;display:flex;align-items:center;justify-content:center;font-size:22px;color:#666;">暂无信息</div>`;
};

function checkDevSize(){
    // 处于窗口化桌面 / iframe 中时跳过尺寸检测，避免把正常窄窗口误判成开发者工具
    if (window.top !== window.self) return;
    const threshold = 150;
    if (Math.abs(window.outerWidth - window.innerWidth) > threshold || Math.abs(window.outerHeight - window.innerHeight) > threshold) {
        clearPage();
    }
}
setInterval(checkDevSize, 400);

(function() {
    function debugTrap() {
        try { debugger; } catch(e) {}
    }
    setInterval(debugTrap, 800);
})();

document.oncontextmenu = function(){return false;};
document.onkeydown = function(e){
    e = e || window.event;
    if(e.keyCode===123) return false;
    if(e.ctrlKey && e.keyCode===85) return false;
    if(e.ctrlKey && e.shiftKey && (e.keyCode===73||e.keyCode===74)) return false;
};
history.pushState(null, null, window.location.href);
window.addEventListener('popstate',function(){
    history.pushState(null,null,window.location.href);
});

//搜索功能
const searchInput = document.querySelector('#search-input');
const searchBtn = document.querySelector('#search-btn');

function doSearch(){
    const keyword = searchInput.value.trim();
    if(!keyword){
        alert("请输入搜索关键词");
        return;
    }
    if(keyword === "静心科"){
        location.href = "jxin.html";
    }else if(keyword === "静心疗愈，守护心灵"){
        location.href = "idea.html";
    }else if(keyword === "18305564297806"){
        location.href = "tel.html";
    }else if(keyword === "god"){
        location.href = "god.html";
    }else if(keyword === "念头"){
        location.href = "niantou.html";
    }else if(keyword === "抑郁障碍"){
        location.href = "yiyu.html";
    }else if(keyword === "抑郁"){
        location.href = "yiyu.html";
    }else if(keyword === "心理修复"){
        location.href = "heart.html";
    }else if(keyword === "视觉干扰"){
        location.href = "jxin.html";
    }else if(keyword === "五感"){
        location.href = "wugan.html";
    }else if(keyword === "思维循环"){
        location.href = "zhiliao.html";
    }else if(keyword === "思维"){
        location.href = "zhiliao.html";
    }else if(keyword === "沈从良"){
        location.href = "shen.html";
    }else if(keyword === "王羽"){
        location.href = "wangyu.html";
    }else if(keyword === "林晚"){
        location.href = "linwan.html";
    }else if(keyword === "深度治疗"){
        location.href = "zhiliao.html";
    }else if(keyword === "静心"){
        location.href = "heart.html";
    }else if(keyword === "heart"){
        location.href = "heart.html";
    }else if(keyword === "research"){
        location.href = "research.html";
    }else{
        alert("搜索关键词：" + keyword);
    }
}
searchBtn.addEventListener('click',doSearch);
searchInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter') doSearch();
});

//电话拨打逻辑
const telInput = document.getElementById('telInput');
const callBtn = document.getElementById('callBtn');
const audio1 = document.getElementById('audio1');
const audio2 = document.getElementById('audio2');

callBtn.addEventListener('click',()=>{
    const val = telInput.value.trim();
    if(val === "0000-8866-9922"){
        audio1.currentTime = 0;
        audio1.play();
    }else if(val === "18305564297806"){
        audio2.currentTime = 0;
        audio2.play();
    }else{
        alert("无效的内部号码");
    }
});
//回车也可以拨打
telInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter') callBtn.click();
})
</script>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
    <script src="keywords.js" defer></script>
</body>
</html>
