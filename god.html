<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>god</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        body {
            background-color: #ffffff;
            transition: background-color 0.3s;
            position: relative;
        }
        /*背景重复文字层，无透明度，更小更密，制造汉字恐怖谷*/
        .bg-text-wrap {
            position: absolute;
            inset: 0;
            z-index: 1;
            color: #c81010;
            font-size: 22px;
            line-height: 1.1;
            letter-spacing:-2px;
            word-break: break-all;
        }
        /*中心眼睛*/
        .eye-box {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            cursor: pointer;
        }
        .eye-box img {
            width: 180px;
            height: auto;
            display: block;
        }
        /*随机生成的眼睛*/
        .rand-eye {
            position: absolute;
            z-index: 15;
            pointer-events: none;
        }
        .rand-eye img {
            width: 100%;
            height: auto;
            display:block;
        }
        /*点击切换后样式*/
        body.red-mode {
            background-color: #b82020;
        }
        body.red-mode .bg-text-wrap {
            color: #000000;
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
</head>
<body>
<div class="bg-text-wrap" id="bgText"></div>
<div class="eye-box" id="eyeWrap">
    <img id="eyeImg" src="eye_close.jpg" alt="闭眼">
</div>

<script>
//================安全防调试代码================
let devToolOpened = false;
const clearPage = () => {
    if(devToolOpened) return;
    devToolOpened = true;
    document.body.innerHTML = `<div style="width:100%;height:100vh;display:flex;align-items:center;justify-content:center;font-size:22px;color:#666;">暂无信息</div>`;
};
function checkDevSize(){
    // 处于窗口化桌面 / iframe 中时跳过尺寸检测，避免把正常窄窗口误判成开发者工具
    if (window.top !== window.self) return;
    const threshold = 150;
    if (Math.abs(window.outerWidth - window.innerWidth) > threshold || Math.abs(window.outerHeight - window.innerHeight) > threshold) {
        clearPage();
    }
}
setInterval(checkDevSize, 400);
(function() {
    function debugTrap() {
        try { debugger; } catch(e) {}
    }
    setInterval(debugTrap, 800);
})();
document.oncontextmenu = function(){return false;};
document.onkeydown = function(e){
    e = e || window.event;
    if(e.keyCode===123) return false;
    if(e.ctrlKey && e.keyCode===85) return false;
    if(e.ctrlKey && e.shiftKey && (e.keyCode===73||e.keyCode===74)) return false;
};
history.pushState(null, null, window.location.href);
window.addEventListener('popstate',function(){
    history.pushState(null,null,window.location.href);
});
//================================================

//生成极密的“静心”文字
const bgTextDom = document.getElementById('bgText');
let textPool = '';
for(let i = 0; i < 3500; i++){
    textPool += '静心';
}
bgTextDom.innerText = textPool;

const eyeWrap = document.getElementById('eyeWrap');
const eyeImg = document.getElementById('eyeImg');
let clicked = false;

//生成随机多处睁眼
function spawnRandomEyes(count = 22){
    const body = document.body;
    for(let i=0;i<count;i++){
        const div = document.createElement('div');
        div.className = "rand-eye";
        const img = document.createElement('img');
        img.src = "eye_open.jpg";

        //大小区间：60px ~ 140px
        const size = 60 + Math.random() * 80;
        //旋转角度 -35 ~ 35度
        const rotate = -35 + Math.random() * 70;
        //屏幕随机位置，防止贴边
        const x = Math.random() * (window.innerWidth - size);
        const y = Math.random() * (window.innerHeight - size);

        div.style.left = x + "px";
        div.style.top = y + "px";
        div.style.width = size + "px";
        div.style.transform = `rotate(${rotate}deg)`;
        div.appendChild(img);
        body.appendChild(div);
    }
}

eyeWrap.addEventListener('click',function(){
    if(clicked) return;
    clicked = true;
    //切换中心为睁眼图片
    eyeImg.src = "eye_open.jpg";
    //背景变红、文字变黑
    document.body.classList.add('red-mode');
    //生成屏幕各处随机睁眼
    spawnRandomEyes(22);
    //延时改为2秒后跳转 eye.html
    setTimeout(()=>{
        location.href = "eye.html";
    },2000);
})
</script>
    <script src="arg-ui.js" defer></script>
    <script src="desktop-app.js" defer></script>
</body>
</html>
