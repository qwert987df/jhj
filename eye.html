<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eye</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            height: 100%;
            background: #000;
        }
        body {
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 34px 26px 74px;
            background:
                radial-gradient(120% 90% at 50% 40%, #170203 0%, #050101 48%, #000 100%);
            color: #ff2a2a;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            font-size: 26px;
            line-height: 2.15;
            cursor: pointer;
            text-shadow: 0 0 18px rgba(255, 0, 0, .32);
        }

        /* 演出舞台：抖动只作用在这一层 */
        .hz-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56vh;
        }

        #box {
            width: min(880px, 100%);
            text-align: center;
            transform-origin: 50% 50%;
            transition: transform 1.4s cubic-bezier(.22, 1, .36, 1);
        }

        .text-line {
            text-align: center;
            margin: 7px 0;
            letter-spacing: .06em;
            word-break: break-word;
        }

        .text-line.hz-em {
            color: #fff;
        }
    </style>
    <link rel="stylesheet" href="arg-ui.css">
    <link rel="stylesheet" href="horror.css">
</head>
<body>

<div class="hz-stage" id="hzStage">
    <div id="box"></div>
</div>

<script src="horror.js"></script>
<script>
/* =========================================================================
   eye —— 蒙眼、回忆、视线
   恐怖节奏：压抑感逐句爬升 → 「回想到眼睛」放出暗处的眼睛
             → 「对了」一次惊吓重击 → 短暂假平静 → 白光灌入（进入验光）
   ========================================================================= */
(function () {
    'use strict';

    var lines = [
        "你试着如同抑郁患者静心那样",
        "从抽屉里拿出小时候和妹妹玩捉迷藏用的眼罩",
        "不算太大，勉强能遮上眼",
        "屏蔽一感，你感到空前的宁静",
        "静下心……",
        "可脑子里止不住的想起关于妹妹的回忆",
        "回想到眼睛",
        "对了",
        "你们远眺远方的山岗，畅谈着理想",
        "你还想起了小时候的验光流程"
    ];

    // 每一句对应的压迫感（0~1）
    var DREAD = [0.05, 0.12, 0.22, 0.10, 0.30, 0.46, 0.66, 0.86, 0.34, 0.74];

    var index = 0;
    var finishing = false;
    var navigated = false;
    var box = document.getElementById('box');

    HORROR.init({
        stage: '#hzStage',
        lines: '#box',
        heartbeat: 52,
        hint: '▸ 点击继续'
    });

    function go() {
        if (navigated) return;
        navigated = true;
        HORROR.stopBeat();
        location.href = 'yanguang.html';
    }

    /* 最后一段：上升音 → 重击 → 白光淹没一切 */
    function finish() {
        if (finishing) return;
        finishing = true;
        HORROR.dread(1);
        HORROR.setLens(16);
        HORROR.riser(2.4);
        box.style.transform = 'scale(1.07)';
        setTimeout(function () { HORROR.glitch(0.55, 320); HORROR.whisper(); }, 900);
        setTimeout(function () { HORROR.hit(); HORROR.flash(null, 760); }, 2200);
        setTimeout(function () { HORROR.fadeTo('#ffffff', 900, go); }, 2320);
    }

    document.body.addEventListener('click', function () {
        if (finishing) { go(); return; }
        if (index >= lines.length) { finish(); return; }

        var i = index;
        index++;

        var em = (i === 6 || i === 7 || i === 9);
        HORROR.line(lines[i], { em: em });

        var d = DREAD[i] == null ? 0.5 : DREAD[i];
        HORROR.dread(d);
        box.style.transform = 'scale(' + (1 + d * 0.055).toFixed(3) + ')';

        // ---- 逐句的恐怖节点 ----
        switch (i) {
            case 2:                             // 眼罩
                HORROR.static(0.22, 0.09);
                break;
            case 3:                             // 空前的宁静（听觉被放大）
                HORROR.breathe();
                HORROR.setLens(48);
                break;
            case 4:                             // 静下心……
                HORROR.whisper();
                HORROR.glitch(0.22, 140);
                break;
            case 5:                             // 止不住地想起妹妹
                HORROR.breathe();
                HORROR.shake('light');
                HORROR.static(0.3, 0.08);
                break;
            case 6:                             // 回想到眼睛
                HORROR.eyes(5);
                HORROR.hit();
                HORROR.glitch(0.7, 260);
                break;
            case 7:                             // 对了
                HORROR.flash('red', 460);
                HORROR.glitch(0.95, 300);
                HORROR.shake('heavy');
                HORROR.static(0.4, 0.14);
                HORROR.eyes(3);
                break;
            case 8:                             // 远眺山岗（短暂的假平静）
                HORROR.breathe();
                HORROR.flash('dark', 380);
                break;
            case 9:                             // 验光流程 → 白光
                finish();
                break;
        }
    });

    // 键盘也能推进
    document.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            document.body.click();
        }
    });
})();
</script>
<script src="arg-ui.js" defer></script>
<script src="desktop-app.js" defer></script>
</body>
</html>
